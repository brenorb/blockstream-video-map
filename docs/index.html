<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockstream Video Map</title>
<meta name="description" content="Blockstream’s public video catalog on a semantic map built with open-source embeddings, plus six clearly marked hypothetical video ideas.">
<meta property="og:title" content="Blockstream Video Map">
<meta property="og:description" content="Explore Blockstream videos by semantic similarity, using descriptions and metadata only.">
<meta property="og:image" content="screenshot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="map" aria-label="Map of Blockstream videos by semantic similarity"></canvas>

<header class="top">
  <div class="kicker"><span class="num">01</span><span class="rule"></span>MAP OF MEANING</div>
  <h1>Blockstream Videos</h1>
  <p class="sub" id="sub">Loading…</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search videos…" autocomplete="off" aria-label="Search videos">
  <div class="seg" role="group" aria-label="Color by">
    <button data-color="cluster" class="on">Topic</button>
    <button data-color="year">Year</button>
  </div>
  <button id="toggle-ghosts" class="pill on" title="Show hypothetical video ideas">★ Hypothetical</button>
  <button id="toggle-legend" class="pill" title="Show topics">Topics</button>
</div>

<aside id="legend" class="legend" hidden></aside>

<aside id="card" class="card" hidden></aside>

<div id="tip" class="tip" hidden></div>

<footer class="foot">
  <span id="foot-model"></span> · UMAP · <a href="https://www.youtube.com/@Blockstream/videos">video source</a>
  · Descriptions and metadata only · Not affiliated with Blockstream.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
